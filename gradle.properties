# IDE the plugin is compiled against and launched in by `runIde`. Where it does not exist (CI),
# PhpStorm `platformVersion` is downloaded instead; Plugin Verifier also checks IntelliJ IDEA of that version.
localIdePath=/Applications/PhpStorm.app
platformVersion=2026.3
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
kotlin.code.style=official
